version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  mg-gateway:
    image: saicismartapi/saic-python-mqtt-gateway:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    env_file: .env
    environment:
      SAIC_USER: ${SAIC_USER}
      SAIC_PASSWORD: ${SAIC_PASSWORD}
      SAIC_REGION: ${SAIC_REGION}
      MQTT_URI: tcp://mosquitto:1883

  yemot-bridge:
    build: ./bridge
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"

volumes:
  mosquitto_data:
  mosquitto_log:
