# Used in two setups: (1) as its own container talking to sibling containers
# over the docker-compose network (VPS path), or (2) inside the combined
# single-container Render image, reachable only via 127.0.0.1 from the other
# processes in the same container - Render never exposes this port publicly
# either way, only the bridge's HTTP port is routed to the internet.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
# Verbose logging (temporary, while diagnosing the "protocol error" loop
# seen in production - default logging only prints "disconnected due to
# protocol error" with no detail on which client or why. Can be dialed back
# to just `log_type error` once that's understood/fixed.)
log_type all
connection_messages true
