# Used in two setups: (1) as its own container talking to sibling containers
# over the docker-compose network (VPS path), or (2) inside the combined
# single-container Render image, reachable only via 127.0.0.1 from the other
# processes in the same container - Render never exposes this port publicly
# either way, only the bridge's HTTP port is routed to the internet.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
